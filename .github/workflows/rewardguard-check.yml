name: rewardguard

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: rewardguard-caller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rewardguard:
    uses: Advanced-Digital-Marketing-LTDA/workflows/.github/workflows/rewardguard.yml@v0 # reviewed shared release channel
    permissions:
      contents: read
      pull-requests: write
      checks: write
    with:
      run-tests: false
      node-version: '24'
    secrets:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
