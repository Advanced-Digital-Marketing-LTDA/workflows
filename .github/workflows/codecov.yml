name: Upload coverage to Codecov

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Coverage artifact uploaded by the calling job in this run.
        required: false
        type: string
        default: coverage
      coverage-file:
        description: Report path after downloading the artifact into coverage/.
        required: false
        type: string
        default: coverage/lcov.info
    secrets:
      CODECOV_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  codecov:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out caller repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - name: Download coverage artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact-name }}
          path: coverage
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45 # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          files: ${{ inputs.coverage-file }}
          disable_search: true
          fail_ci_if_error: true
