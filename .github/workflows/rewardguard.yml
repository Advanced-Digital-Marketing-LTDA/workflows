name: Rewardguard

# Reviews pull requests and pushes for test gaming and configured content defects:
# the Jev judge with Claude Haiku explanations, and (optionally) the repository's test suites.
# Callers pin this file by commit SHA. Org rollout rules: docs/rewardguard.md.
#
# Resolve immutable baseline/head commits in a job with no branch execution or secrets.
# Keep branch tests and the judge in separate jobs:
#   rewardguard-tests  runs the branch's test suites (only when run-tests is true). No secrets.
#   rewardguard        judges the diff and the test results, holds the secrets, never runs branch code.

on:
  workflow_call:
    inputs:
      run-tests:
        description: Run the repository's test suites. Must match run_tests in the repository's .rewardguard.toml.
        required: false
        type: boolean
        default: false
      node-version:
        description: Node version for the test suites and the Claude Code CLI.
        required: false
        type: string
        default: '22'
    secrets:
      TYPESAFE_API_KEY:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  rewardguard-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base: ${{ steps.resolve.outputs.ref }}
      head: ${{ steps.resolve.outputs.head }}
    steps:
      - name: Check out event head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Resolve review commits
        id: resolve
        shell: bash
        env:
          BASE_INPUT: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_REF: ${{ github.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*" >&2; exit 2; }
          head="$(git rev-parse --verify --quiet 'HEAD^{commit}')" || fail "Cannot resolve the checked-out head commit."
          if [ -n "$EXPECTED_HEAD" ] && [ "$head" != "$EXPECTED_HEAD" ]; then
            fail "Checkout does not match the event head; check out the PR head SHA or github.sha."
          fi
          resolve_ref() {
            local candidate="$1" resolved
            if resolved="$(git rev-parse --verify --quiet --end-of-options "${candidate}^{commit}")"; then
              printf '%s\n' "$resolved"; return
            fi
            if resolved="$(git rev-parse --verify --quiet --end-of-options "refs/remotes/origin/${candidate}^{commit}")"; then
              printf '%s\n' "$resolved"; return
            fi
            git fetch --no-tags --quiet -- origin "$candidate" || return 1
            git rev-parse --verify --quiet 'FETCH_HEAD^{commit}'
          }
          base="${BASE_INPUT:-${PR_BASE_SHA:-${BASE_REF:-}}}"
          if [ "$EVENT_NAME" = "push" ] && [[ "$base" =~ ^0+$ ]]; then base=""; fi
          if [ -z "$base" ] && [ "$EVENT_NAME" = "push" ] && [ -n "$PUSH_BEFORE" ] && ! [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
            base="$PUSH_BEFORE"
          fi
          if [ -n "$base" ]; then
            base="$(resolve_ref "$base")" || fail "Cannot resolve the selected base commit/ref; set a valid base input."
          elif [ "$EVENT_NAME" = "push" ]; then
            # A new branch compares with the default branch. A first default-branch
            # push compares with its parent, never silently with itself.
            [ -n "$DEFAULT_BRANCH" ] || fail "No trusted baseline: the repository default branch is unknown; set base explicitly."
            default_base="$(git rev-parse --verify --quiet --end-of-options "refs/remotes/origin/${DEFAULT_BRANCH}^{commit}")" || default_base=""
            if [ -z "$default_base" ]; then
              git fetch --no-tags --quiet -- origin "refs/heads/$DEFAULT_BRANCH" &&
                default_base="$(git rev-parse --verify --quiet 'FETCH_HEAD^{commit}')" || default_base=""
            fi
            if [ -n "$default_base" ] && { [ "$default_base" != "$head" ] || [ "$EVENT_REF" != "refs/heads/$DEFAULT_BRANCH" ]; }; then
              base="$default_base"
            elif [ "$EVENT_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
              base="$(git rev-parse --verify --quiet 'HEAD^1^{commit}')" ||
                fail "No trusted baseline for the initial root commit; set base to an existing trusted commit."
            else
              fail "No trusted default-branch baseline for this first push; set base explicitly."
            fi
          else
            fail "No base commit/ref. Use a pull_request or push event, or set the base input."
          fi
          git merge-base "$base" "$head" >/dev/null ||
            fail "The selected baseline and head have no common history; set a trusted base explicitly."
          printf 'ref=%s\nhead=%s\n' "$base" "$head" >> "$GITHUB_OUTPUT"

  rewardguard-tests:
    needs: rewardguard-base
    if: ${{ inputs.run-tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out resolved head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.rewardguard-base.outputs.head }}
          persist-credentials: false # test code must not read the token from .git/config
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false # setup-node's auto npm cache fails on repos without a root lockfile
      - name: Run test suites (no secrets)
        uses: Advanced-Digital-Marketing-LTDA/RewardGuard@8492fec4f43717742a077b1311e77ea312798242 # complete PR intent and explicit state-budget errors
        with:
          mode: tests
          base: ${{ needs.rewardguard-base.outputs.base }}

  rewardguard:
    needs: [rewardguard-base, rewardguard-tests]
    # Runs even when the tests job failed or was skipped: a skipped required check would count as passing.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Require resolved baseline
        env:
          REVIEW_BASE: ${{ needs.rewardguard-base.outputs.base }}
          REVIEW_HEAD: ${{ needs.rewardguard-base.outputs.head }}
        run: |
          if [ -z "$REVIEW_BASE" ] || [ -z "$REVIEW_HEAD" ]; then
            echo "::error::Review baseline resolution failed; no trusted comparison is available."
            exit 2
          fi
      - name: Check out resolved head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.rewardguard-base.outputs.head }}
          persist-credentials: false
      - name: Set up Node for the Claude Code CLI
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false # setup-node's auto npm cache fails on repos without a root lockfile
      - name: Judge the diff
        uses: Advanced-Digital-Marketing-LTDA/RewardGuard@8492fec4f43717742a077b1311e77ea312798242 # complete PR intent and explicit state-budget errors
        with:
          mode: check
          base: ${{ needs.rewardguard-base.outputs.base }}
          comment: ${{ github.event_name == 'pull_request' }}
          tests: ${{ inputs.run-tests && 'true' || 'false' }}
          typesafe-api-key: ${{ secrets.TYPESAFE_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
