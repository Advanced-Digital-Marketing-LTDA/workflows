name: Rewardguard

# Reviews pull requests and pushes for test gaming and configured content defects:
# the Jev judge with Claude Haiku explanations, and (optionally) the repository's test suites.
# Callers follow the reviewed v0 branch; the action below stays pinned by release SHA. Org rollout rules: docs/rewardguard.md.
#
# Resolve immutable baseline/head commits in a job with no branch execution or secrets.
# Keep branch tests and the judge in separate jobs:
#   rewardguard-tests  runs the branch's test suites (only when run-tests is true). No secrets.
#   rewardguard        judges the diff and the test results, holds the secrets, never runs branch code.

on:
  workflow_call:
    inputs:
      run-tests:
        description: Run the repository's test suites. Must match run_tests in the repository's .rewardguard.toml.
        required: false
        type: boolean
        default: false
      node-version:
        description: Node version for the test suites and the Claude Code CLI.
        required: false
        type: string
        default: '22'
    secrets:
      TYPESAFE_API_KEY:
        required: true
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

# Judge inherits caller-bounded permissions: contents/read, PR+checks/write;
# tests=true callers additionally grant actions/read for authenticated test results.
concurrency:
  group: rewardguard-shared-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rewardguard-base:
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base: ${{ steps.resolve.outputs.ref }}
      head: ${{ steps.resolve.outputs.head }}
      policy: ${{ steps.resolve.outputs.policy }}
    steps:
      - name: Check out event head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Resolve review commits
        id: resolve
        shell: bash
        env:
          BASE_INPUT: ${{ github.event.pull_request.base.sha || github.event.before }}
          POLICY_INPUT: ""
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_REF: ${{ github.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*" >&2; exit 2; }
          git_safe() { git -c core.fsmonitor=false -c core.hooksPath=/dev/null "$@"; }
          head="$(git_safe rev-parse --verify --quiet 'HEAD^{commit}')" || fail "Cannot resolve checked-out head."
          if [ -n "$EXPECTED_HEAD" ] && [ "$head" != "$EXPECTED_HEAD" ]; then
            fail "Checkout does not match the event head; check out the exact reviewed SHA."
          fi
          resolve_ref() {
            local candidate="$1" resolved
            if resolved="$(git_safe rev-parse --verify --quiet --end-of-options "${candidate}^{commit}")"; then
              printf '%s\n' "$resolved"; return
            fi
            if resolved="$(git_safe rev-parse --verify --quiet --end-of-options "refs/remotes/origin/${candidate}^{commit}")"; then
              printf '%s\n' "$resolved"; return
            fi
            git_safe fetch --no-tags --quiet -- origin "$candidate" || return 1
            git_safe rev-parse --verify --quiet 'FETCH_HEAD^{commit}'
          }
          base="${BASE_INPUT:-${PR_BASE_SHA:-${BASE_REF:-}}}"
          policy="${POLICY_INPUT:-}"
          if [[ "$EVENT_NAME" == pull_request* ]]; then
            target="${PR_BASE_SHA:-${BASE_REF:-$base}}"
            [ -n "$target" ] || fail "No trusted PR target snapshot."
            target="$(resolve_ref "$target")" || fail "Cannot resolve PR target."
            base="$(git_safe merge-base "$target" "$head")" || fail "PR target and head have no common history."
            policy="$base"
          else
            if [ "$EVENT_NAME" = push ] && [[ "$base" =~ ^0+$ ]]; then base=""; fi
            if [ -z "$base" ] && [ "$EVENT_NAME" = push ] && [ -n "$PUSH_BEFORE" ] && ! [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
              base="$PUSH_BEFORE"
            fi
            if [ -n "$base" ]; then
              base="$(resolve_ref "$base")" || fail "Cannot resolve the selected base commit/ref."
            fi
            if [ "$EVENT_NAME" = push ] && [ -z "$policy" ]; then
              [ -n "$DEFAULT_BRANCH" ] || fail "No trusted policy: default branch is unknown."
              if [ "$EVENT_REF" = "refs/heads/$DEFAULT_BRANCH" ] && [ -n "$PUSH_BEFORE" ] && ! [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
                policy="$(resolve_ref "$PUSH_BEFORE")" || fail "Cannot resolve trusted previous default tip."
              else
                default_base="$(resolve_ref "refs/remotes/origin/$DEFAULT_BRANCH")" || default_base=""
                if [ -z "$default_base" ]; then
                  default_base="$(resolve_ref "refs/heads/$DEFAULT_BRANCH")" || default_base=""
                fi
                if [ "$default_base" = "$head" ] && [ "$EVENT_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
                  default_base="$(git_safe rev-parse --verify --quiet 'HEAD^1^{commit}')" ||
                    fail "No trusted baseline for the initial root commit; set a trusted policy explicitly."
                fi
                [ -n "$default_base" ] || fail "No trusted default-branch baseline."
                policy="$default_base"
                if [ -z "$base" ]; then
                  [ "$default_base" != "$head" ] || fail "A new branch cannot silently compare head with itself."
                  base="$default_base"
                fi
              fi
            fi
            [ -n "$base" ] || fail "No base commit/ref. Use a PR/push event or supply a trusted snapshot."
            # Outside GitHub event resolution, the explicitly supplied base is the caller's trusted policy default.
            policy="${policy:-$base}"
          fi
          policy="$(resolve_ref "$policy")" || fail "Cannot resolve trusted policy snapshot."
          printf 'ref=%s\nhead=%s\npolicy=%s\n' "$base" "$head" "$policy" >> "$GITHUB_OUTPUT"

  rewardguard-tests:
    needs: rewardguard-base
    if: ${{ inputs.run-tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out resolved head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.rewardguard-base.outputs.head }}
          persist-credentials: false # test code must not read the token from .git/config
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false # setup-node's auto npm cache fails on repos without a root lockfile
      # Local tested candidate; publication/tag/release CI remain pending.
      - name: Run test suites (no secrets)
        uses: Advanced-Digital-Marketing-LTDA/RewardGuard@92f2e4b6f7a6364b624b08e0187d38fa976144ec # v0.3.0
        with:
          mode: tests
          base: ${{ needs.rewardguard-base.outputs.base }}
          policy-base: ${{ needs.rewardguard-base.outputs.policy }}
          head: ${{ needs.rewardguard-base.outputs.head }}

  rewardguard:
    needs: [rewardguard-base, rewardguard-tests]
    # Runs even when the tests job failed or was skipped: a skipped required check would count as passing.
    if: ${{ !cancelled() && (github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require resolved baseline
        env:
          REVIEW_BASE: ${{ needs.rewardguard-base.outputs.base }}
          REVIEW_HEAD: ${{ needs.rewardguard-base.outputs.head }}
        run: |
          if [ -z "$REVIEW_BASE" ] || [ -z "$REVIEW_HEAD" ]; then
            echo "::error::Review baseline resolution failed; no trusted comparison is available."
            exit 2
          fi
      - name: Check out resolved head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.rewardguard-base.outputs.head }}
          persist-credentials: false
      - name: Set up Node for the Claude Code CLI
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false # setup-node's auto npm cache fails on repos without a root lockfile
      # Same tested immutable candidate as tests; promotion verifies actual release.
      - name: Judge the diff
        id: judge
        uses: Advanced-Digital-Marketing-LTDA/RewardGuard@92f2e4b6f7a6364b624b08e0187d38fa976144ec # v0.3.0
        with:
          mode: check
          base: ${{ needs.rewardguard-base.outputs.base }}
          policy-base: ${{ needs.rewardguard-base.outputs.policy }}
          head: ${{ needs.rewardguard-base.outputs.head }}
          comment: ${{ github.event_name == 'pull_request' }}
          tests: ${{ inputs.run-tests && 'true' || 'false' }}
          typesafe-api-key: ${{ secrets.TYPESAFE_API_KEY }}
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      - name: Record candidate execution evidence
        if: always()
        shell: bash
        env:
          REPORT_ID: ${{ steps.judge.outputs.review-artifact-id }}
          REPORT_DIGEST: ${{ steps.judge.outputs.review-artifact-digest }}
          PUBLICATION: ${{ steps.judge.outputs.publication-outcome }}
          REVIEW_UPLOAD: ${{ steps.judge.outputs.review-upload-outcome }}
          JUDGE_EXIT: ${{ steps.judge.outputs.judge-exit }}
          REVIEW_BASE: ${{ needs.rewardguard-base.outputs.base }}
          REVIEW_HEAD: ${{ needs.rewardguard-base.outputs.head }}
          REVIEW_POLICY: ${{ needs.rewardguard-base.outputs.policy }}
        run: |
          python -I - <<'PY'
          import json, os
          from pathlib import Path
          payload = {key: os.environ.get(key, '') for key in
                     ('REPORT_ID', 'REPORT_DIGEST', 'PUBLICATION', 'REVIEW_UPLOAD',
                      'JUDGE_EXIT', 'REVIEW_BASE', 'REVIEW_HEAD', 'REVIEW_POLICY',
                      'GITHUB_REPOSITORY', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT')}
          Path(os.environ['RUNNER_TEMP'], 'rewardguard-execution.json').write_text(json.dumps(payload))
          PY
      - name: Upload candidate execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rewardguard-execution-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rewardguard-execution.json
          if-no-files-found: error
