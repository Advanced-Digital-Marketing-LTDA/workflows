version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    # RewardGuard is an owned release reviewed in the shared workflow PR;
    # avoid the default three-day delay before Dependabot proposes it.
    cooldown:
      exclude:
        - Advanced-Digital-Marketing-LTDA/RewardGuard
    allow:
      - dependency-name: Advanced-Digital-Marketing-LTDA/RewardGuard
    ignore:
      - dependency-name: Advanced-Digital-Marketing-LTDA/RewardGuard
        update-types:
          - version-update:semver-major
    groups:
      rewardguard-release:
        patterns:
          - Advanced-Digital-Marketing-LTDA/RewardGuard
