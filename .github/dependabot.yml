version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-name: Advanced-Digital-Marketing-LTDA/RewardGuard
    ignore:
      - dependency-name: Advanced-Digital-Marketing-LTDA/RewardGuard
        update-types:
          - version-update:semver-major
    groups:
      rewardguard-release:
        patterns:
          - Advanced-Digital-Marketing-LTDA/RewardGuard
